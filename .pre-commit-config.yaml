repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: format
        name: Format code
        entry: make format
        language: system
        files: \.(c|h|cpp|hpp|cc|cxx)$

  - repo: local
    hooks:
      - id: kernel-build
        name: Build kernel
        entry: make build
        language: system
        pass_filenames: false
