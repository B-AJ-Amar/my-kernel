name: Test

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '*.gdb'
      - '.gitignore'
      - '.pre-commit-config.yaml'
      - 'LICENSE'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Pull kernel-builder image
        run: docker pull ghcr.io/b-aj-amar/kernel-builder:latest

      - name: Build kernel
        run: make build-ci

      - name: Verify disk image
        run: |
          test -f bin/disk.img
          ls -lh bin/disk.img
