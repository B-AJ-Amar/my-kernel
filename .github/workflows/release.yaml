name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '*.gdb'
      - '.gitignore'
      - '.pre-commit-config.yaml'
      - 'LICENSE'

  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Pull kernel-builder image
        run: docker pull ghcr.io/b-aj-amar/kernel-builder:latest

      - name: Build kernel
        run: make build-ci

      - name: Verify disk image
        run: |
          test -f bin/disk.img
          ls -lh bin/disk.img
  release:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Run Semantic Release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BEFORE=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          npx semantic-release

          git fetch --force --tags origin

          AFTER=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          echo "BEFORE=$BEFORE"
          echo "AFTER=$AFTER"

          if [ "$BEFORE" != "$AFTER" ]; then
            echo "new_release_published=true" >> "$GITHUB_OUTPUT"
            echo "new_release_tag=$AFTER" >> "$GITHUB_OUTPUT"
            echo "new_release_version=${AFTER#v}" >> "$GITHUB_OUTPUT"
            echo "new_release_git_head=$(git rev-list -n 1 "$AFTER")" >> "$GITHUB_OUTPUT"
          else
            echo "new_release_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Debug outputs
        run: |
          echo "published = ${{ steps.semantic.outputs.new_release_published }}"
          echo "version   = ${{ steps.semantic.outputs.new_release_version }}"
          echo "tag       = ${{ steps.semantic.outputs.new_release_tag }}"
          echo "commit    = ${{ steps.semantic.outputs.new_release_git_head }}"

      - name: Checkout release commit
        if: steps.semantic.outputs.new_release_published == 'true'
        run: |
          git checkout ${{ steps.semantic.outputs.new_release_git_head }}

      - name: Pull kernel-builder image
        if: steps.semantic.outputs.new_release_published == 'true'
        run: |
          docker pull ghcr.io/b-aj-amar/kernel-builder:latest

      - name: Build kernel
        if: steps.semantic.outputs.new_release_published == 'true'
        run: |
          make build-ci

      - name: Verify artifacts
        if: steps.semantic.outputs.new_release_published == 'true'
        run: |
          test -f bin/disk.img
          test -f bin/kernel.bin
          test -f build/kernel.elf

      - name: Upload release assets
        if: steps.semantic.outputs.new_release_published == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.semantic.outputs.new_release_tag }}" \
            bin/disk.img \
            bin/kernel.bin \
            build/kernel.elf \
            --clobber
